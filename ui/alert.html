<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NoDupDownload</title>
    <link rel="stylesheet" href="alert.css" />
    <script src="alert.js" defer></script>
  </head>
  <body>
    <h1 id="title">Possible duplicate download detected.</h1>
    <p id="message">The download was blocked. Choose continue or cancel.</p>
    <div class="actions">
      <button id="cancelButton">Cancel</button>
      <button id="continueButton" class="primary">Continue</button>
    </div>
  </body>
</html>
